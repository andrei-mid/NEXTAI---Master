# Alembic config (D5). Run from the repo root:
#   uv run alembic -c verifirm/persistence/alembic.ini upgrade head
#   uv run alembic -c verifirm/persistence/alembic.ini revision --autogenerate -m "<area>_<what>"
# The message MUST start with an area: companies_, runs_, signals_, scores_, memos_, audit_,
# source_cache_, onrc_, graph_, sanctions_  (enforced by tests/architecture/test_migrations.py).
# The database URL comes from DATABASE_URL via verifirm.core.config (see migrations/env.py).

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
prepend_sys_path = .
timezone = UTC
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
