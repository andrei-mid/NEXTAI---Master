# Local services only (D5, D6). The API and worker run on the host: `make run-api`, `make run-worker`.
# Postgres MUST stay on the same major version as AWS RDS (17).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: verifirm
      POSTGRES_PASSWORD: verifirm  # local dev only
      POSTGRES_DB: verifirm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifirm -d verifirm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
