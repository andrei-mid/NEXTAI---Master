[project]
name = "verifirm"
version = "0.1.0"
description = "Agentic background checks for Romanian companies (Raiffeisen Bank Romania hackathon)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verifirm", "apps"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
# Tests live next to the code they test (verifirm/<area>/tests/) so each owner
# stays inside their own folder. importlib mode allows repeated basenames.
addopts = "--import-mode=importlib -ra"
testpaths = ["verifirm", "apps", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["verifirm/persistence/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = [
    "E501",                             # ruff format handles wrapping; rule tables stay one-per-line
    "RUF001", "RUF002", "RUF003",       # Romanian diacritics in strings/comments are fine
    "UP042",                            # the contract spec uses (str, Enum) exactly
    "B008",                             # FastAPI's Depends()/File() defaults
]

[tool.ruff.lint.isort]
known-first-party = ["verifirm", "apps"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ['/tests/', '/migrations/']
